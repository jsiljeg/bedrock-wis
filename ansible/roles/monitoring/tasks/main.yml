- name: Ensure base dir exists
  file:
    path: /var/www/bedrock
    state: directory
    mode: "0755"

- name: Copy monitoring tree from repo (idempotent)
  synchronize:
    src: "{{ playbook_dir }}/../monitoring/"
    dest: /var/www/bedrock/
    delete: no
  delegate_to: localhost

# ---- render config templates that live inside monitoring/ ----
- name: Render Prometheus config
  template:
    src: "{{ playbook_dir }}/../monitoring/prometheus/prometheus.yml.j2"
    dest: /var/www/bedrock/prometheus/prometheus.yml
    mode: "0644"
  notify: Restart stack

- name: Render Alertmanager config
  template:
    src: "{{ playbook_dir }}/../monitoring/alertmanager/alertmanager.yml.j2"
    dest: /var/www/bedrock/alertmanager/alertmanager.yml
    mode: "0644"
  notify: Restart stack

# ---- render .env and compose from role templates ----
- name: Render .env
  template:
    src: .env.j2
    dest: /var/www/bedrock/.env
    mode: "0600"
  notify: Restart stack

- name: Render docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: /var/www/bedrock/docker-compose.yml
    mode: "0644"
  notify: Restart stack

# Optional: ensure Docker is up (if docker role didn’t do it)
- name: Ensure docker service running
  service:
    name: docker
    state: started
    enabled: true

- name: Pull images & start stack
  shell: |
    set -e
    docker compose -f /var/www/bedrock/docker-compose.yml up -d --pull=always
  register: upout
  changed_when: "'Started' in upout.stdout or 'Pulled' in upout.stdout"

# Health: make sure Prometheus is up (Grafana/AM checks are in your GHA)
- name: Wait Prometheus ready
  uri:
    url: http://127.0.0.1:9090/-/ready
    status_code: 200
  register: _pm
  retries: 12
  delay: 5
  until: _pm.status == 200

# Handler
- name: Restart stack
  listen: Restart stack
  shell: |
    set -e
    docker compose -f /var/www/bedrock/docker-compose.yml up -d
