---
- name: Deploy/Update Monitoring Stack (no-vault)
  hosts: all
  gather_facts: false
  vars:
    deploy_path: "{{ deploy_path | default('/var/www/bedrock') }}"
    mon_dir: "{{ deploy_path }}/shared/monitoring"

  tasks:
    - name: Ensure monitoring dir exists
      ansible.builtin.file:
        path: "{{ mon_dir }}"
        state: directory
        mode: "0755"

    - name: Rsync monitoring/ repo content to VM (except .env)
      ansible.builtin.synchronize:
        src: "../monitoring/"
        dest: "{{ mon_dir }}/"
        rsync_opts:
          - "--delete"
          - "--exclude=.env"
      delegate_to: localhost

    - name: Render .env from GH env vars
      ansible.builtin.template:
        src: "templates/monitoring.env.j2"
        dest: "{{ mon_dir }}/.env"
        owner: root
        group: root
        mode: "0600"

    - name: Pull images
      ansible.builtin.shell: docker compose pull
      args:
        chdir: "{{ mon_dir }}"

    - name: Up stack
      ansible.builtin.shell: docker compose up -d
      args:
        chdir: "{{ mon_dir }}"

    - name: Show status
      ansible.builtin.shell: docker compose ps
      args:
        chdir: "{{ mon_dir }}"
      register: ps_out

    - ansible.builtin.debug:
        var: ps_out.stdout_lines
