- name: Deploy/Update Monitoring Stack
  hosts: bedrock
  become: true
  vars:
    # Where your monitoring stack should live on the VM
    monitoring_dir: /var/www/bedrock/shared/monitoring
    # Reverse-proxy base URL (HTTP now; HTTPS later)
    public_host: "34.88.159.90"
    grafana_root_url: "http://{{ public_host }}/grafana"
    prom_external_url: "http://{{ public_host }}/prometheus"
    am_external_url: "http://{{ public_host }}/alertmanager"

    # Provide these via --extra-vars or vault
    slack_webhook_url: "{{ lookup('env','SLACK_WEBHOOK_URL') | default(omit) }}"
    slack_channel: "{{ lookup('env','SLACK_CHANNEL') | default('all-testing-purposes') }}"
    grafana_admin_user: "{{ lookup('env','GF_ADMIN_USER') | default('admin') }}"
    grafana_admin_password: "{{ lookup('env','GF_ADMIN_PASSWORD') | default(omit) }}"

  roles:
    - monitoring
