---
- name: Deploy/Update Monitoring Stack (repo-driven)
  hosts: all
  become: true
  collections:
    - community.docker

  vars:
    deploy_path: "{{ lookup('env','DEPLOY_PATH') | default('/var/www/bedrock/shared/monitoring', true) }}"
    gf_admin_user: "{{ lookup('env','GF_ADMIN_USER') | default('admin', true) }}"
    gf_admin_password: "{{ lookup('env','GF_ADMIN_PASSWORD') | default('admin', true) }}"
    slack_webhook_url: "{{ lookup('env','SLACK_WEBHOOK_URL') | default('', true) }}"
    slack_channel: "{{ lookup('env','SLACK_CHANNEL') | default('', true) }}"
    repo_monitoring_src: "{{ playbook_dir }}/../monitoring"   # repo-local folder

  tasks:
    - name: Ensure packages for Docker
      apt:
        update_cache: true
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Install Docker engine + compose plugin (Debian/Ubuntu)
      apt:
        name:
          - docker.io
          - docker-compose-plugin
        state: present

    - name: Enable/start Docker
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Create target directory
      file:
        path: "{{ deploy_path }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # --- Push repo/monitoring contents verbatim ---

    - name: Copy monitoring tree from repo to VM
      copy:
        src: "{{ repo_monitoring_src }}/"
        dest: "{{ deploy_path }}/"
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"

    - name: Render Prometheus config from template if present
      when: lookup('ansible.builtin.fileglob', repo_monitoring_src + '/prometheus/prometheus.yml.j2', errors='ignore') != ''
      template:
        src: "{{ repo_monitoring_src }}/prometheus/prometheus.yml.j2"
        dest: "{{ deploy_path }}/prometheus/prometheus.yml"
        mode: "0644"
      vars:
        bedrock_health_url: "{{ lookup('env','HEALTHCHECK_URL') | default('http://127.0.0.1', true) }}"
      notify: Restart stack

    - name: Render Alertmanager config from template if present
      when: lookup('ansible.builtin.fileglob', repo_monitoring_src + '/alertmanager/alertmanager.yml.j2', errors='ignore') != ''
      template:
        src: "{{ repo_monitoring_src }}/alertmanager/alertmanager.yml.j2"
        dest: "{{ deploy_path }}/alertmanager/alertmanager.yml"
        mode: "0644"
      vars:
        slack_webhook_url: "{{ lookup('env','SLACK_WEBHOOK_URL') | default('', true) }}"
        slack_channel: "{{ lookup('env','SLACK_CHANNEL') | default('', true) }}"
      notify: Restart stack


    # Optional: render .env from template if present
    - name: Render .env from .env.template (if exists)
      when: lookup('ansible.builtin.fileglob', repo_monitoring_src + '/.env.template', errors='ignore') != ''
      template:
        src: "{{ repo_monitoring_src }}/.env.template"
        dest: "{{ deploy_path }}/.env"
        mode: "0640"
      vars:
        GF_ADMIN_USER: "{{ gf_admin_user }}"
        GF_ADMIN_PASSWORD: "{{ gf_admin_password }}"
        SLACK_WEBHOOK_URL: "{{ slack_webhook_url }}"
        SLACK_CHANNEL: "{{ slack_channel }}"

    # --- Safety: ensure no fixed container_name entries (avoid collisions) ---

    - name: Remove any container_name lines from docker-compose.yml
      lineinfile:
        path: "{{ deploy_path }}/docker-compose.yml"
        regexp: '^\s*container_name:'
        state: absent
      notify: Restart stack

    # --- One-time cleanup for legacy fixed names & network ---

    - name: Remove legacy containers with fixed names (safe if absent)
      shell: |
        set -e
        for c in prometheus alertmanager grafana; do
          if docker ps -a --format '{{"{{"}}.Names{{"}}"}}' | grep -qx "$c"; then
            docker rm -f "$c"
          fi
        done
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Remove legacy 'monitoring_net' if it conflicts (safe if absent/unused)
      command: docker network rm monitoring_net
      changed_when: false
      failed_when: false

    # --- Compose up (idempotent) ---

    - name: Pull images and start stack
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_path }}"
        project_name: monitoring
        state: present
        pull: always
        recreate: auto
        remove_orphans: true

    # --- Readiness checks ---

    - name: Wait for Prometheus to be ready
      wait_for:
        host: 127.0.0.1
        port: 9090
        delay: 1
        timeout: 90

    - name: Wait for Alertmanager to be ready
      wait_for:
        host: 127.0.0.1
        port: 9093
        delay: 1
        timeout: 90

    - name: Wait for Grafana to be ready
      wait_for:
        host: 127.0.0.1
        port: 3000
        delay: 1
        timeout: 90

  handlers:
    - name: Restart stack
      community.docker.docker_compose_v2:
        project_src: "{{ deploy_path }}"
        project_name: monitoring
        state: present
        pull: never
        recreate: always
        remove_orphans: true
