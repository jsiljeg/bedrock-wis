name: Rollback to previous release
description: Switch 'current' symlink to the previous release
inputs:
  host: { required: true }
  user: { required: true }
  ssh-private-key: { required: true }
  deploy-path: { required: true }
runs:
  using: composite
  steps:
    - name: Write SSH key
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.ssh-private-key }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        printf "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

    - name: Select previous release and switch
      shell: bash
      run: |
        ssh -i ~/.ssh/id_rsa ${{ inputs.user }}@${{ inputs.host }} bash -se << 'EOS'
        set -euo pipefail
        DEPLOY_PATH="${{ inputs.deploy-path }}"
        SHARED_DIR="${DEPLOY_PATH}/shared"

        cd "${DEPLOY_PATH}/releases"
        PREV=$(ls -1t | sed -n '2p' || true)
        if [ -z "$PREV" ]; then
          echo "No previous release to roll back to."
          exit 1
        fi

        # Make sure shared perms are correct (reason 500 previously)
        sudo install -d -m 750 -o $USER -g www-data "${SHARED_DIR}"
        if [ -f "${SHARED_DIR}/.env" ]; then
          sudo chgrp www-data "${SHARED_DIR}/.env"
          sudo chmod 640 "${SHARED_DIR}/.env"
        fi

        # Ensure previous release has .env and uploads linked
        if [ -d "${DEPLOY_PATH}/releases/${PREV}" ]; then
          ln -sfn "${SHARED_DIR}/.env" "${DEPLOY_PATH}/releases/${PREV}/.env"
          rm -rf "${DEPLOY_PATH}/releases/${PREV}/web/app/uploads"
          ln -sfn "${SHARED_DIR}/uploads" "${DEPLOY_PATH}/releases/${PREV}/web/app/uploads"
        fi

        ln -sfn "${DEPLOY_PATH}/releases/${PREV}" "${DEPLOY_PATH}/current"

        # Reload web stack (best-effort)
        if command -v systemctl >/dev/null 2>&1; then
          sudo systemctl reload apache2 || true
          sudo systemctl reload php8.2-fpm || true
          sudo systemctl reload nginx || true
        fi

        echo "Rolled back to $PREV"
        EOS
