name: Deploy to VM (atomic)
description: Upload tarball and swap symlink atomically
inputs:
  host: { required: true }
  user: { required: true }
  ssh-private-key: { required: true }
  deploy-path: { required: true }
  tarball: { required: true }
runs:
  using: composite
  steps:
    - name: Write SSH key
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.ssh-private-key }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        printf "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

    - name: Upload tarball
      shell: bash
      run: |
        rsync -e "ssh -i ~/.ssh/id_rsa" -avz "${{ inputs.tarball }}" "${{ inputs.user }}@${{ inputs.host }}:/tmp/"

    - name: Remote deploy (releases/current)
      shell: bash
      run: |
        ssh -i ~/.ssh/id_rsa ${{ inputs.user }}@${{ inputs.host }} bash -se << 'EOS'
        set -euo pipefail
        DEPLOY_PATH="${{ inputs.deploy-path }}"
        TARBALL="/tmp/${{ inputs.tarball }}"
        TS=$(date -u +"%Y%m%d-%H%M%S")
        REL_DIR="${DEPLOY_PATH}/releases/${TS}"

        sudo mkdir -p "${DEPLOY_PATH}/releases" "${DEPLOY_PATH}/shared/uploads"
        sudo chown -R $USER:$USER "${DEPLOY_PATH}"

        mkdir -p "${REL_DIR}"
        tar -xzf "${TARBALL}" -C "${REL_DIR}"

        echo "== sanity: top of release =="
        ls -lah "${REL_DIR}" | head -n 100

        if [ ! -f "${REL_DIR}/web/wp/wp-includes/version.php" ]; then
          echo "ERROR: WordPress core missing under ${REL_DIR}/web/wp"
          echo "Show some files under web/ to debug:"
          find "${REL_DIR}/web" -maxdepth 3 -type f | sed "s|${REL_DIR}/||" | head -n 200 || true
          exit 1
        fi

        # Verify WordPress core exists
        if [ ! -f "${REL_DIR}/web/wp/wp-includes/version.php" ]; then
          echo "ERROR: WordPress core missing under ${REL_DIR}/web/wp"
          echo "Debug: show top-level of web and web/wp:"
          find "${REL_DIR}/web" -maxdepth 2 -type f | sed "s|${REL_DIR}/||" | head -n 200 || true
          exit 1
        fi

        # Sanity: ensure WordPress core is present
        if [ ! -f "${REL_DIR}/web/wp/wp-settings.php" ]; then
          echo "ERROR: WordPress core (web/wp) is missing in the release."
          echo "Contents under ${REL_DIR}/web (depth 2) for debugging:"
          find "${REL_DIR}/web" -maxdepth 2 -type f | sed "s|${REL_DIR}/||" | head -n 200 || true
          exit 1
        fi

        # Link shared bits (.env and uploads)
        if [ -f "${DEPLOY_PATH}/shared/.env" ]; then
          ln -sfn "${DEPLOY_PATH}/shared/.env" "${REL_DIR}/.env"
        fi
        mkdir -p "${REL_DIR}/web/app/uploads"
        rm -rf "${REL_DIR}/web/app/uploads"
        ln -sfn "${DEPLOY_PATH}/shared/uploads" "${REL_DIR}/web/app/uploads"


        # Ensure current is a symlink (not a directory)
        if [ -d "${DEPLOY_PATH}/current" ] && [ ! -L "${DEPLOY_PATH}/current" ]; then
          echo "Detected directory at ${DEPLOY_PATH}/current — removing to replace with symlink."
          rm -rf "${DEPLOY_PATH}/current"
        fi

        ln -sfnT "${REL_DIR}" "${DEPLOY_PATH}/current"


        # Swap current symlink atomically
        ln -sfnT "${REL_DIR}" "${DEPLOY_PATH}/current"

        # Adjust permissions (Apache/NGINX/PHP-FPM user may vary)
        sudo chown -h $USER:$USER "${DEPLOY_PATH}/current"
        sudo chown -R www-data:www-data "${REL_DIR}/web/app/uploads" || true

        # Reload services (adjust for your stack)
        if command -v systemctl >/dev/null 2>&1; then
          sudo systemctl reload apache2 || true
        fi

        # Keep last 5 releases
        cd "${DEPLOY_PATH}/releases"
        ls -1t | tail -n +6 | xargs -r rm -rf

        rm -f "${TARBALL}"
        EOS
