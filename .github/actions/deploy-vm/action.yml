name: Deploy to VM (atomic)
description: Upload tarball and swap symlink atomically
inputs:
  host: { required: true }
  user: { required: true }
  ssh-private-key: { required: true }
  deploy-path: { required: true }
  tarball: { required: true }
runs:
  using: composite
  steps:
    - name: Write SSH key
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.ssh-private-key }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        printf "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

    - name: Upload tarball
      shell: bash
      run: |
        rsync -e "ssh -i ~/.ssh/id_rsa" -avz "${{ inputs.tarball }}" "${{ inputs.user }}@${{ inputs.host }}:/tmp/"

    - name: Remote deploy (releases/current)
      shell: bash
      run: |
        ssh -i ~/.ssh/id_rsa ${{ inputs.user }}@${{ inputs.host }} bash -se << 'EOS'
        set -euo pipefail
        DEPLOY_PATH="${{ inputs.deploy-path }}"
        TARBALL="/tmp/${{ inputs.tarball }}"
        TS=$(date -u +"%Y%m%d-%H%M%S")
        REL_DIR="${DEPLOY_PATH}/releases/${TS}"
        SHARED_DIR="${DEPLOY_PATH}/shared"

        sudo mkdir -p "${DEPLOY_PATH}/releases" "${SHARED_DIR}/uploads"
        sudo chown -R $USER:$USER "${DEPLOY_PATH}"

        mkdir -p "${REL_DIR}"
        tar -xzf "${TARBALL}" -C "${REL_DIR}"

        echo "== sanity: top of release =="
        ls -lah "${REL_DIR}" | head -n 100

        # Verify WP core is present in the release package
        if [ ! -f "${REL_DIR}/web/wp/wp-settings.php" ]; then
          echo "ERROR: WordPress core (web/wp) is missing in the release."
          find "${REL_DIR}/web" -maxdepth 3 -type f | sed "s|${REL_DIR}/||" | head -n 200 || true
          exit 1
        fi

        # --- Shared bits & permissions (critical for healthcheck) ---
        # Ensure shared exists and readable by www-data group
        sudo install -d -m 750 -o $USER -g www-data "${SHARED_DIR}"
        # Ensure uploads exists and writable by www-data
        sudo install -d -m 775 -o www-data -g www-data "${SHARED_DIR}/uploads"

        # .env must exist and be readable by www-data
        if [ -f "${SHARED_DIR}/.env" ]; then
          sudo chgrp www-data "${SHARED_DIR}/.env"
          sudo chmod 640 "${SHARED_DIR}/.env"
        else
          echo "WARNING: ${SHARED_DIR}/.env missing; creating empty placeholder (edit on server)."
          sudo install -m 640 -o $USER -g www-data /dev/null "${SHARED_DIR}/.env"
        fi

        # Link shared .env and uploads into the new release
        ln -sfn "${SHARED_DIR}/.env" "${REL_DIR}/.env"
        rm -rf "${REL_DIR}/web/app/uploads"
        ln -sfn "${SHARED_DIR}/uploads" "${REL_DIR}/web/app/uploads"

        # Ensure Bedrock .htaccess exists (safety guard)
        if [ ! -f "${REL_DIR}/web/.htaccess" ]; then
          cat > "${REL_DIR}/web/.htaccess" <<'HT'
        <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
        </IfModule>
        HT
        fi

        # Ensure current is a symlink (not a directory)
        if [ -d "${DEPLOY_PATH}/current" ] && [ ! -L "${DEPLOY_PATH}/current" ]; then
          echo "Detected directory at ${DEPLOY_PATH}/current — removing to replace with symlink."
          rm -rf "${DEPLOY_PATH}/current"
        fi

        # Atomic switch
        ln -sfnT "${REL_DIR}" "${DEPLOY_PATH}/current"

        # Ownerships
        sudo chown -h $USER:$USER "${DEPLOY_PATH}/current"
        sudo chown -R www-data:www-data "${SHARED_DIR}/uploads" || true

        # Reload Apache (best-effort)
        if command -v systemctl >/dev/null 2>&1; then
          sudo systemctl reload apache2 || true
        fi

        # Keep last 5 releases
        cd "${DEPLOY_PATH}/releases"
        ls -1t | tail -n +6 | xargs -r rm -rf

        rm -f "${TARBALL}"
        EOS
