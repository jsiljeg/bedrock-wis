name: Deploy Monitoring (no-vault, Ansible)

on:
  workflow_dispatch:
    inputs:
      run-health-checks:
        description: "Run post-deploy health checks?"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-monitoring-ansible
  cancel-in-progress: false

jobs:
  deploy_monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python & Ansible
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: |
          python -m pip install --upgrade pip
          pip install "ansible==9.*"

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.GCE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.GCE_HOST }}" >> ~/.ssh/known_hosts

      - name: Run Ansible playbook (no-vault)
        working-directory: ansible
        env:
          # Target VM
          GCE_HOST:    ${{ secrets.GCE_HOST }}
          GCE_USER:    ${{ secrets.GCE_USER }}
          DEPLOY_PATH: ${{ secrets.GCE_DEPLOY_PATH }}

          # Secrets consumed by the template
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL:     ${{ secrets.SLACK_CHANNEL }}
          GF_ADMIN_USER:     ${{ secrets.GF_ADMIN_USER }}
          GF_ADMIN_PASSWORD: ${{ secrets.GF_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          # If your play uses docker modules, uncomment this:
          # ansible-galaxy collection install community.docker >/dev/null 2>&1 || true

          ansible-playbook -i ansible/inventory.ini monitoring.yml

      - name: Post-deploy health checks (via SSH)
        if: inputs.run-health-checks == true
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.GCE_USER }}@${{ secrets.GCE_HOST }} bash -se <<'EOS'
          set -euo pipefail
          # Use prefixed paths if you configured Prometheus/Alertmanager with /prometheus, /alertmanager
          curl -fsS http://127.0.0.1:9090/prometheus/-/ready || curl -fsS http://127.0.0.1:9090/-/ready
          curl -fsS http://127.0.0.1:9093/alertmanager/-/ready || curl -fsS http://127.0.0.1:9093/-/ready
          curl -fsS http://127.0.0.1:3000/api/health
          docker compose -f /var/www/bedrock/shared/monitoring/docker-compose.yml ps
          EOS
