name: Deploy Monitoring (no-vault, Ansible)

on:
  workflow_dispatch:
    inputs:
      run-health-checks:
        description: "Run post-deploy health checks?"
        type: boolean
        default: true

  push:
    branches:
      - master
    paths:
      # Only run when monitoring stack or its playbook/templates change
      - 'monitoring/**'
      - 'ansible/monitoring.yml'
      - 'ansible/roles/monitoring/**'
      - 'ansible/roles/docker/**'
      - '.github/workflows/deploy-monitoring-ansible.yml'

permissions:
  contents: read

concurrency:
  group: deploy-monitoring-ansible
  cancel-in-progress: false

jobs:
  deploy_monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python & Ansible
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: |
          python -m pip install --upgrade pip
          pip install "ansible==9.*"

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.GCE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.GCE_HOST }}" >> ~/.ssh/known_hosts

      - name: Install required Ansible collections
        run: |
          ansible-galaxy collection install community.general community.docker


      - name: Deploy monitoring stack with Ansible (inline inventory)
        env:
          GCE_HOST:    ${{ secrets.GCE_HOST }}
          GCE_USER:    ${{ secrets.GCE_USER }}
          DEPLOY_PATH: ${{ secrets.GCE_DEPLOY_PATH }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL:     ${{ secrets.SLACK_CHANNEL }}
          GF_ADMIN_USER:     ${{ secrets.GF_ADMIN_USER }}
          GF_ADMIN_PASSWORD: ${{ secrets.GF_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          export ANSIBLE_HOST_KEY_CHECKING=False
          export ANSIBLE_PRIVATE_KEY_FILE=$HOME/.ssh/id_rsa

          # Run the playbook from repo root; inventory is a literal host list (note the comma!)
          ansible-playbook -i "${GCE_HOST}," -u "${GCE_USER}" \
            --private-key "$ANSIBLE_PRIVATE_KEY_FILE" \
            -e "ansible_host=${GCE_HOST}" \
            -e "ansible_user=${GCE_USER}" \
            ansible/monitoring.yml
