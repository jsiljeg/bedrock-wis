name: Deploy Monitoring (Ansible on runner)

on:
  push:
    branches: [ master ]

  workflow_dispatch:
    inputs:
      run-health-checks:
        description: "Run post-deploy health checks?"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-monitoring-ansible
  cancel-in-progress: false

jobs:
  deploy_monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python & Ansible
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: |
          python -m pip install --upgrade pip
          pip install "ansible==9.*"

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.GCE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.GCE_HOST }}" >> ~/.ssh/known_hosts

      - name: Run Ansible playbook
        working-directory: ansible
        env:
          # VM / paths
          GCE_HOST:          ${{ secrets.GCE_HOST }}
          GCE_USER:          ${{ secrets.GCE_USER }}
          DEPLOY_PATH:       ${{ secrets.GCE_DEPLOY_PATH }}

          # Secrets your play turns into monitoring/.env on the VM
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL:     ${{ secrets.SLACK_CHANNEL }}
          GF_ADMIN_USER:     ${{ secrets.GF_ADMIN_USER }}
          GF_ADMIN_PASSWORD: ${{ secrets.GF_ADMIN_PASSWORD }}

          # Vault (set ANSIBLE_VAULT_PASSWORD; ANSIBLE_VAULT_ID is optional)
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          ANSIBLE_VAULT_ID:       ${{ secrets.ANSIBLE_VAULT_ID }}
        run: |
          set -euo pipefail

          # If your role uses community.docker modules, install the collection (safe if re-run)
          ansible-galaxy collection install community.docker >/dev/null 2>&1 || true

          VAULT_FLAG=""
          if [ -n "${ANSIBLE_VAULT_PASSWORD:-}" ]; then
            # write a local .vault file (not committed)
            printf '%s' "$ANSIBLE_VAULT_PASSWORD" > .vault
            chmod 600 .vault

            # Use a named vault-id if your vault header includes one; otherwise just the password file
            if [ -n "${ANSIBLE_VAULT_ID:-}" ]; then
              VAULT_FLAG="--vault-id ${ANSIBLE_VAULT_ID}@.vault"
            else
              VAULT_FLAG="--vault-password-file .vault"
            fi
          else
            echo "::error::ANSIBLE_VAULT_PASSWORD secret is not set; cannot decrypt group_vars/all/vault.yml"
            exit 1
          fi

          # Optional quick sanity (won't print contents; just verifies the password is valid)
          ansible-vault view group_vars/all/vault.yml $VAULT_FLAG >/dev/null

          ansible-playbook -i inventory.ini monitoring.yml \
            $VAULT_FLAG \
            --extra-vars "target_host=${GCE_HOST} target_user=${GCE_USER} deploy_path=${DEPLOY_PATH}"

      - name: Post-deploy health checks (via SSH)
        if: inputs.run-health-checks == true
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.GCE_USER }}@${{ secrets.GCE_HOST }} bash -se <<'EOS'
          set -euo pipefail
          # Adjust if you removed Prometheus/Alertmanager prefixes
          curl -fsS http://127.0.0.1:9090/prometheus/-/ready
          curl -fsS http://127.0.0.1:9093/alertmanager/-/ready
          curl -fsS http://127.0.0.1:3000/api/health
          docker compose -f /var/www/bedrock/shared/monitoring/docker-compose.yml ps
          EOS
