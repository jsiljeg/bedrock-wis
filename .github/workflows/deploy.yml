name: Bedrock Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write  # create release

concurrency:
  group: bedrock-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PHP_VERSION: "8.2"
  NODE_VERSION: "20"
  THEME_DIR: "web/app/themes/sage"
  PLUGINS_DIR: "web/app/plugins"
  # Build-time plugins (from GitHub):
  BUILD_PLUGINS: |
    https://github.com/Yoast/wordpress-seo
    https://github.com/woocommerce/woocommerce

jobs:
  bedrock_build:
    name: Build Bedrock (Composer)
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.pkg.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Composer / PHP and Cache
        uses: ./.github/actions/setup-composer
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Install Composer deps (no dev)
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev

      - name: Create vendor artifact
        id: pkg
        run: |
          tar -czf vendor.tar.gz vendor
          echo "artifact_name=vendor.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload vendor artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: vendor.tar.gz
          retention-days: 3

  theme_build:
    name: Build Sage 10 (Bud, cached)
    runs-on: ubuntu-latest
    env:
      THEME_DIR: web/app/themes/sage
      NODE_VERSION: "20"

    steps:
      - uses: actions/checkout@v4

      # Composer for theme (Acorn)
      - name: Install PHP + Composer
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y php-cli unzip
          EXPECTED_SIGNATURE="$(curl -fsSL https://composer.github.io/installer.sig)"
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          ACTUAL_SIGNATURE="$(php -r "echo hash_file('sha384', 'composer-setup.php');")"
          [ "$EXPECTED_SIGNATURE" = "$ACTUAL_SIGNATURE" ]
          php composer-setup.php --quiet
          rm composer-setup.php

      - name: Cache Composer (theme)
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles(format('{0}/composer.lock', env.THEME_DIR)) }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Composer install (no-dev) in theme
        shell: bash
        run: |
          set -euxo pipefail
          php composer.phar --working-dir="${THEME_DIR}" install --no-interaction --no-dev --prefer-dist

      # Node + Yarn with built-in cache
      - name: Setup Node (Yarn cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: ${{ env.THEME_DIR }}/yarn.lock

      - name: Build theme (Bud)
        shell: bash
        working-directory: ${{ env.THEME_DIR }}
        run: |
          set -euxo pipefail
          corepack enable
          yarn --version
          yarn install --frozen-lockfile
          # Clean any Vite leftovers just in case
          rm -rf public/build || true
          yarn build

          echo "== List public =="
          ls -la public || true
          echo "== Show Bud entrypoints =="
          test -f public/entrypoints.json && head -n 50 public/entrypoints.json || true

          # HARD REQUIREMENT for Sage 10 (Bud)
          test -f public/entrypoints.json || (echo "ERROR: missing public/entrypoints.json" && exit 1)

      - name: Upload theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: theme-build
          path: ${{ env.THEME_DIR }}
          retention-days: 3


  plugins_build:
    name: Assemble Plugins (GitHub sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prep plugins dir
        run: |
          mkdir -p "${{ env.PLUGINS_DIR }}"
          echo "${{ env.BUILD_PLUGINS }}" > plugins.txt

      - name: Fetch plugins
        run: |
          set -euo pipefail
          while read -r url; do
            [ -z "$url" ] && continue
            repo=$(basename "$url")
            dir="${repo%.*}"
            git clone --depth=1 "$url" "${{ env.PLUGINS_DIR }}/${dir}"
            rm -rf "${{ env.PLUGINS_DIR }}/${dir}/.git"
          done < plugins.txt

      - name: Upload plugins artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: ${{ env.PLUGINS_DIR }}
          retention-days: 3

  package_release:
    name: Package Release
    runs-on: ubuntu-latest
    needs: [bedrock_build, theme_build, plugins_build]
    outputs:
      release_tarball: ${{ steps.bundle.outputs.release_tarball }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./_artifacts

      - name: Unpack vendor
        run: |
          tar -xzf ./_artifacts/vendor/vendor.tar.gz

      - name: Inject built theme + plugins (if present)
        run: |
          set -euo pipefail
          if [ -d ./_artifacts/theme-build ]; then
            mkdir -p web/app/themes/sage
            rsync -a ./_artifacts/theme-build/ web/app/themes/sage/
          else
            echo "No theme-build artifact; skipping theme injection."
          fi
          if [ -d ./_artifacts/plugins ]; then
            rsync -a ./_artifacts/plugins/ web/app/plugins/
          else
            echo "No plugins artifact; skipping plugin injection."
          fi

      - name: Prune dev files
        run: |
          find . -name ".git" -type d -prune -exec rm -rf {} +
          rm -rf node_modules */node_modules **/node_modules || true

      - name: Release meta
        id: meta
        run: |
          TS=$(date -u +"%Y%m%d-%H%M%S")
          echo "release_name=bedrock-${TS}" >> "$GITHUB_OUTPUT"

      - name: Setup Composer / PHP
        uses: ./.github/actions/setup-composer
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Composer install (no dev) in packaging workspace
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev

      - name: Ensure WordPress core exists in web/wp (WP-CLI fallback)
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -f web/wp/wp-settings.php ]; then
            echo "web/wp missing; fetching WordPress core via WP-CLI fallback..."
            curl -fsSL -o wp.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
            php wp.phar core download --path=web/wp --version=6.8.3 --skip-content
          fi
          test -f web/wp/wp-settings.php

      - name: Verify release contents
        run: |
          set -e
          [ -f web/wp/wp-settings.php ] || { echo "ERROR: web/wp missing from release"; exit 1; }

      - name: Install Acorn plugin into Bedrock (conflict-safe, no-dev)
        shell: bash
        run: |
          set -euxo pipefail
          export COMPOSER_NO_INTERACTION=1
          export COMPOSER_NO_AUDIT=1

          # allow acorn's composer plugin if present
          composer config allow-plugins.roots/acorn-installer true || true

          # Strip the dev-only WP-CLI meta to avoid symfony/process replacement conflicts in the lock
          if composer show --locked wp-cli/wp-cli-bundle >/dev/null 2>&1; then
            composer remove --dev wp-cli/wp-cli-bundle --no-update || true
            composer update --no-dev --no-progress --prefer-dist
          fi

          # helper: try to add acorn with a constrained, targeted update
          try_acorn () {
            local ver="$1"
            composer require roots/acorn:"$ver" -W --no-update --no-progress --prefer-dist
            # this is the only line that may fail; on failure we return non-zero
            composer update roots/acorn --with-all-dependencies --no-dev --no-progress --prefer-dist
            # confirm via composer (not via a WP path)
            composer show roots/acorn | grep -E '^versions\s*:' >/dev/null
            composer install --no-dev --no-progress --prefer-dist -o
          }

          # Prefer Acorn v5, fallback to v4.4 only if the update fails
          if ! try_acorn '^5.0'; then
            echo 'Acorn ^5 failed; falling back to ^4.4 (Symfony 6 compatible)'
            composer remove roots/acorn --no-update || true
            try_acorn '^4.4'
          fi

      - name: Bundle release tarball
        id: bundle
        run: |
          set -euxo pipefail
          name="${{ steps.meta.outputs.release_name }}"
          STAGE="$(mktemp -d)"
          rsync -a --delete \
            --exclude '_artifacts' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '*.tar.gz' \
            ./ "$STAGE/"
          tar -C "$STAGE" -czf "/tmp/${name}.tar.gz" .
          mv "/tmp/${name}.tar.gz" .
          echo "release_tarball=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload release tarball (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: ${{ steps.bundle.outputs.release_tarball }}
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_name }}
          name: ${{ steps.meta.outputs.release_name }}
          generate_release_notes: true
          files: ${{ steps.bundle.outputs.release_tarball }}

  deploy:
    name: Deploy to GCE VM
    runs-on: ubuntu-latest
    needs: [package_release]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-tarball
          path: .

      - name: Deploy via SSH/Rsync (atomic releases)
        uses: ./.github/actions/deploy-vm
        with:
          host: ${{ secrets.GCE_HOST }}
          user: ${{ secrets.GCE_USER }}
          ssh-private-key: ${{ secrets.GCE_SSH_KEY }}
          deploy-path: ${{ secrets.GCE_DEPLOY_PATH }}
          tarball: ${{ needs.package_release.outputs.release_tarball }}

      # This is idempotent
      - name: One-time WP core install (idempotent)
        uses: ./.github/actions/wp-core-install
        with:
          host: ${{ secrets.GCE_HOST }}
          user: ${{ secrets.GCE_USER }}
          ssh-private-key: ${{ secrets.GCE_SSH_KEY }}
          deploy-path: ${{ secrets.GCE_DEPLOY_PATH }}
          admin-user: ${{ secrets.WP_ADMIN_USER }}
          admin-pass: ${{ secrets.WP_ADMIN_PASS }}
          admin-email: ${{ secrets.WP_ADMIN_EMAIL }}

      - name: Fix Acorn cache permissions (shared, persistent)
        shell: bash
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.GCE_USER }}@${{ secrets.GCE_HOST }} bash -se << 'EOS'
          set -euxo pipefail
          cd "${{ secrets.GCE_DEPLOY_PATH }}"

          # Shared Acorn cache (persistent)
          sudo mkdir -p shared/cache/acorn/framework/{cache,views}
          sudo chown -R www-data:www-data shared/cache
          sudo find shared/cache -type d -exec chmod 775 {} \;
          sudo find shared/cache -type f -exec chmod 664 {} \;

          # Link current release to shared cache
          REL=$(readlink -f current)
          if [ -e "$REL/web/app/cache" ] && [ ! -L "$REL/web/app/cache" ]; then
            sudo rm -rf "$REL/web/app/cache"
          fi
          sudo ln -sfn "${PWD}/shared/cache" "$REL/web/app/cache"
          sudo chown -h www-data:www-data "$REL/web/app/cache"
          EOS

      - name: Activate Sage theme + flush rewrites
        shell: bash
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.GCE_USER }}@${{ secrets.GCE_HOST }} bash -se << 'EOS'
          set -euo pipefail
          cd "${{ secrets.GCE_DEPLOY_PATH }}/current"
          if [ -d "web/app/themes/sage" ]; then
            wp --path=web/wp theme activate sage || true
            wp --path=web/wp option update permalink_structure '/%postname%/' || true
            wp --path=web/wp rewrite flush --hard || true
          fi
          EOS

      - name: Activate Acorn + clear caches on VM
        shell: bash
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.GCE_USER }}@${{ secrets.GCE_HOST }} bash -se << 'EOS'
          set -euo pipefail
          cd "${{ secrets.GCE_DEPLOY_PATH }}/current"
          # If Acorn shows up as a plugin, activate it.
          if wp --path=web/wp plugin list --field=name | grep -qx acorn; then
            wp --path=web/wp plugin activate acorn || true
          fi
          # Clear Acorn caches if CLI is available (works when plugin is active)
          wp --path=web/wp acorn optimize:clear || true
          wp --path=web/wp acorn view:clear || true
          EOS

  monitoring_deploy:
    name: Deploy Monitoring Stack
    runs-on: ubuntu-latest
    needs: [ deploy ]   # run after app deploy
    steps:
      - uses: actions/checkout@v4

      - name: Ship monitoring directory
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.GCE_SSH_KEY }}
          ARGS: "-rlgoDzvc -i"
          SOURCE: "monitoring/"
          REMOTE_HOST: ${{ secrets.GCE_HOST }}
          REMOTE_USER: ${{ secrets.GCE_USER }}
          TARGET: ${{ secrets.GCE_DEPLOY_PATH }}/monitoring

      - name: Render env & configs and (re)start compose
        shell: bash
        env:
          GF_ADMIN_USER: ${{ secrets.GF_ADMIN_USER }}
          GF_ADMIN_PASSWORD: ${{ secrets.GF_ADMIN_PASSWORD }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          ALERT_SLACK_WEBHOOK: ${{ secrets.ALERT_SLACK_WEBHOOK }}
          ALERT_SLACK_CHANNEL: ${{ secrets.ALERT_SLACK_CHANNEL }}
          ALERT_ENV: ${{ secrets.ALERT_ENV }}
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.GCE_USER }}@${{ secrets.GCE_HOST }} bash -se <<'EOS'
          set -euxo pipefail
          cd "${{ secrets.GCE_DEPLOY_PATH }}/monitoring"

          # 1) Render Grafana env
          cp .env.template .env
          sed -i \
            -e "s#__GF_ADMIN_USER__#${GF_ADMIN_USER}#g" \
            -e "s#__GF_ADMIN_PASSWORD__#${GF_ADMIN_PASSWORD}#g" \
            .env

          # 2) Inject Bedrock health URL in Prometheus
          sed -i \
            -e "s#__HEALTHCHECK_URL__#${HEALTHCHECK_URL}#g" \
            prometheus/prometheus.yml

          # 3) Inject Slack + env in Alertmanager
          sed -i \
            -e "s#__SLACK_WEBHOOK__#${ALERT_SLACK_WEBHOOK}#g" \
            -e "s#__SLACK_CHANNEL__#${ALERT_SLACK_CHANNEL}#g" \
            -e "s#__ALERT_ENV__#${ALERT_ENV}#g" \
            alertmanager/alertmanager.yml

          # 4) Start/Restart stack
          docker compose pull
          docker compose up -d
          EOS

  health_check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - uses: actions/checkout@v4
      - name: Wait and curl site
        uses: ./.github/actions/health-check
        with:
          url: ${{ secrets.HEALTHCHECK_URL }}
          retries: "15"
          delay-seconds: "15"

  rollback_on_failure:
    name: Rollback if failed
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    needs: [deploy, health_check]
    steps:
      - uses: actions/checkout@v4
      - name: Rollback to previous release
        uses: ./.github/actions/rollback-vm
        with:
          host: ${{ secrets.GCE_HOST }}
          user: ${{ secrets.GCE_USER }}
          ssh-private-key: ${{ secrets.GCE_SSH_KEY }}
          deploy-path: ${{ secrets.GCE_DEPLOY_PATH }}
