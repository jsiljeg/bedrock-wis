name: Bedrock Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write  # create release

concurrency:
  group: bedrock-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PHP_VERSION: "8.2"
  NODE_VERSION: "20"
  THEME_DIR: "web/app/themes/sage"
  PLUGINS_DIR: "web/app/plugins"
  # Build-time plugins (from GitHub) – add/remove as needed:
  BUILD_PLUGINS: |
    https://github.com/Yoast/wordpress-seo
    https://github.com/woocommerce/woocommerce

jobs:
  bedrock_build:
    name: Build Bedrock (Composer)
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.pkg.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Composer / PHP and Cache
        uses: ./.github/actions/setup-composer
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Install Composer deps (no dev)
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev

      - name: Create vendor artifact
        id: pkg
        run: |
          tar -czf vendor.tar.gz vendor
          echo "artifact_name=vendor.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload vendor artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: vendor.tar.gz
          retention-days: 3

  theme_build:
    name: Build Sage Theme (npm, cached)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Sage exists (clone + composer deps)
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -d "${THEME_DIR}" ] || [ ! -f "${THEME_DIR}/package.json" ]; then
            mkdir -p "$(dirname "${THEME_DIR}")"
            git clone --depth=1 https://github.com/roots/sage "${THEME_DIR}"
            # Sage has PHP deps; install via Composer
            sudo apt-get update -y
            sudo apt-get install -y php-cli unzip
            EXPECTED_SIGNATURE="$(curl -fsSL https://composer.github.io/installer.sig)"
            php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
            ACTUAL_SIGNATURE="$(php -r "echo hash_file('sha384', 'composer-setup.php');")"
            [ "$EXPECTED_SIGNATURE" = "$ACTUAL_SIGNATURE" ]
            php composer-setup.php --quiet
            rm composer-setup.php
            php composer.phar --working-dir="${THEME_DIR}" install --no-interaction --no-dev
          fi

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Ensure package-lock.json (for caching)
        shell: bash
        working-directory: ${{ env.THEME_DIR }}
        run: |
          if [ ! -f package-lock.json ]; then
            npm i --package-lock-only
          fi

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ${{ env.THEME_DIR }}/node_modules
          key: node-mod-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', env.THEME_DIR)) }}
          restore-keys: |
            node-mod-${{ runner.os }}-

      - name: Install & build theme
        shell: bash
        working-directory: ${{ env.THEME_DIR }}
        run: |
          npm ci
          npm run build

      - name: Upload theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: theme-build
          path: |
            ${{ env.THEME_DIR }}/public
            ${{ env.THEME_DIR }}/dist
          retention-days: 3



  plugins_build:
    name: Assemble Plugins (GitHub sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prep plugins dir
        run: |
          mkdir -p "${{ env.PLUGINS_DIR }}"
          echo "${{ env.BUILD_PLUGINS }}" > plugins.txt

      - name: Fetch plugins
        run: |
          set -euo pipefail
          while read -r url; do
            [ -z "$url" ] && continue
            repo=$(basename "$url")
            dir="${repo%.*}"
            git clone --depth=1 "$url" "${{ env.PLUGINS_DIR }}/${dir}"
            rm -rf "${{ env.PLUGINS_DIR }}/${dir}/.git"
          done < plugins.txt

      - name: Upload plugins artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: ${{ env.PLUGINS_DIR }}
          retention-days: 3

  package_release:
    name: Package Release
    runs-on: ubuntu-latest
    needs: [bedrock_build, theme_build, plugins_build]
    outputs:
      release_tarball: ${{ steps.bundle.outputs.release_tarball }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./_artifacts

      - name: Unpack vendor
        run: |
          tar -xzf ./_artifacts/vendor/vendor.tar.gz

      - name: Inject built theme + plugins (if present)
        run: |
          set -euo pipefail
          if [ -d ./_artifacts/theme-build ]; then
            mkdir -p web/app/themes/sage
            rsync -a ./_artifacts/theme-build/ web/app/themes/sage/
          else
            echo "No theme-build artifact; skipping theme injection."
          fi
          if [ -d ./_artifacts/plugins ]; then
            rsync -a ./_artifacts/plugins/ web/app/plugins/
          else
            echo "No plugins artifact; skipping plugin injection."
          fi


      - name: Prune dev files
        run: |
          find . -name ".git" -type d -prune -exec rm -rf {} +
          rm -rf node_modules */node_modules **/node_modules || true

      - name: Release meta
        id: meta
        run: |
          TS=$(date -u +"%Y%m%d-%H%M%S")
          echo "release_name=bedrock-${TS}" >> "$GITHUB_OUTPUT"

      # Bring back PHP/Composer so we can materialize web/wp
      - name: Setup Composer / PHP
        uses: ./.github/actions/setup-composer
        with:
          php-version: ${{ env.PHP_VERSION }}

      # Recreate WordPress core (web/wp) from composer.json/lock
      - name: Composer install (materialize web/wp)
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev

      - name: Bundle release tarball
        id: bundle
        run: |
          set -euxo pipefail
          name="${{ steps.meta.outputs.release_name }}"

          # Create a clean snapshot outside the working tree
          STAGE="$(mktemp -d)"

          # Copy everything we want to ship, exclude CI/dev stuff
          rsync -a --delete \
            --exclude '_artifacts' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '*.tar.gz' \
            ./ "$STAGE/"

          # Create tarball OUTSIDE the tree we're archiving
          tar -C "$STAGE" -czf "/tmp/${name}.tar.gz" .

          # Move it back to the workspace so later steps can find it
          mv "/tmp/${name}.tar.gz" .

          echo "release_tarball=${name}.tar.gz" >> "$GITHUB_OUTPUT"


      - name: Upload release tarball (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: ${{ steps.bundle.outputs.release_tarball }}
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_name }}
          name: ${{ steps.meta.outputs.release_name }}
          generate_release_notes: true
          files: ${{ steps.bundle.outputs.release_tarball }}

  deploy:
    name: Deploy to GCE VM
    runs-on: ubuntu-latest
    needs: [package_release]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-tarball
          path: .

      - name: Deploy via SSH/Rsync (atomic releases)
        uses: ./.github/actions/deploy-vm
        with:
          host: ${{ secrets.GCE_HOST }}
          user: ${{ secrets.GCE_USER }}
          ssh-private-key: ${{ secrets.GCE_SSH_KEY }}
          deploy-path: ${{ secrets.GCE_DEPLOY_PATH }}
          tarball: ${{ needs.package_release.outputs.release_tarball }}

      # This is idempotent
      - name: One-time WP core install (idempotent)
        uses: ./.github/actions/wp-core-install
        with:
          host: ${{ secrets.GCE_HOST }}
          user: ${{ secrets.GCE_USER }}
          ssh-private-key: ${{ secrets.GCE_SSH_KEY }}
          deploy-path: ${{ secrets.GCE_DEPLOY_PATH }}
          admin-user: ${{ secrets.WP_ADMIN_USER }}
          admin-pass: ${{ secrets.WP_ADMIN_PASS }}
          admin-email: ${{ secrets.WP_ADMIN_EMAIL }}

  health_check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - uses: actions/checkout@v4
      - name: Wait and curl site
        uses: ./.github/actions/health-check
        with:
          url: ${{ secrets.HEALTHCHECK_URL }}
          retries: "15"
          delay-seconds: "15"

  rollback_on_failure:
    name: Rollback if failed
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    needs: [deploy, health_check]
    steps:
      - uses: actions/checkout@v4
      - name: Rollback to previous release
        uses: ./.github/actions/rollback-vm
        with:
          host: ${{ secrets.GCE_HOST }}
          user: ${{ secrets.GCE_USER }}
          ssh-private-key: ${{ secrets.GCE_SSH_KEY }}
          deploy-path: ${{ secrets.GCE_DEPLOY_PATH }}
