name: Bedrock Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write  # create release

concurrency:
  group: bedrock-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PHP_VERSION: "8.2"
  NODE_VERSION: "20"
  THEME_DIR: "web/app/themes/sage"
  PLUGINS_DIR: "web/app/plugins"
  # Build-time plugins (from GitHub):
  BUILD_PLUGINS: |
    https://github.com/Yoast/wordpress-seo
    https://github.com/woocommerce/woocommerce

jobs:
  bedrock_build:
    name: Build Bedrock (Composer)
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.pkg.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Composer / PHP and Cache
        uses: ./.github/actions/setup-composer
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Install Composer deps (no dev)
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev

      - name: Create vendor artifact
        id: pkg
        run: |
          tar -czf vendor.tar.gz vendor
          echo "artifact_name=vendor.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload vendor artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: vendor.tar.gz
          retention-days: 3

  theme_build:
    name: Build Sage Theme (max-cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) Cache Composer *before* we install Acorn in the theme
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles(format('{0}/composer.lock', env.THEME_DIR)) }}
          restore-keys: |
            composer-${{ runner.os }}-

      # 2) Ensure Sage exists + install Acorn (no dev)
      - name: Ensure Sage exists (clone + composer deps)
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -d "${THEME_DIR}" ] || [ ! -f "${THEME_DIR}/package.json" ]; then
            mkdir -p "$(dirname "${THEME_DIR}")"
            git clone --depth=1 https://github.com/roots/sage "${THEME_DIR}"
          fi
          sudo apt-get update -y
          sudo apt-get install -y php-cli unzip
          EXPECTED_SIGNATURE="$(curl -fsSL https://composer.github.io/installer.sig)"
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          ACTUAL_SIGNATURE="$(php -r "echo hash_file('sha384', 'composer-setup.php');")"
          [ "$EXPECTED_SIGNATURE" = "$ACTUAL_SIGNATURE" ]
          php composer-setup.php --quiet
          rm composer-setup.php
          php composer.phar --working-dir="${THEME_DIR}" install --no-interaction --no-dev

      # 3) Set up Node (no cache here — we do conditional caches below)
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 4) Conditional *package-manager* cache (fast)
      - name: Enable Yarn cache
        if: ${{ hashFiles(format('{0}/yarn.lock', env.THEME_DIR)) != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: ${{ env.THEME_DIR }}/yarn.lock

      - name: Enable pnpm cache
        if: ${{ hashFiles(format('{0}/pnpm-lock.yaml', env.THEME_DIR)) != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.THEME_DIR }}/pnpm-lock.yaml

      - name: Enable npm cache
        if: ${{ hashFiles(format('{0}/package-lock.json', env.THEME_DIR)) != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.THEME_DIR }}/package-lock.json

      # 5) Cache node_modules directly (biggest win)
      - name: Cache node_modules (Yarn)
        if: ${{ hashFiles(format('{0}/yarn.lock', env.THEME_DIR)) != '' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.THEME_DIR }}/node_modules
          key: nm-yarn-${{ runner.os }}-${{ hashFiles(format('{0}/yarn.lock', env.THEME_DIR)) }}
          restore-keys: |
            nm-yarn-${{ runner.os }}-

      - name: Cache node_modules (pnpm)
        if: ${{ hashFiles(format('{0}/pnpm-lock.yaml', env.THEME_DIR)) != '' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.THEME_DIR }}/node_modules
          key: nm-pnpm-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', env.THEME_DIR)) }}
          restore-keys: |
            nm-pnpm-${{ runner.os }}-

      - name: Cache node_modules (npm)
        if: ${{ hashFiles(format('{0}/package-lock.json', env.THEME_DIR)) != '' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.THEME_DIR }}/node_modules
          key: nm-npm-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', env.THEME_DIR)) }}
          restore-keys: |
            nm-npm-${{ runner.os }}-

      # 6) Extra caches per PM
      - name: Cache Yarn Berry artifacts
        if: ${{ hashFiles(format('{0}/yarn.lock', env.THEME_DIR)) != '' }}
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.THEME_DIR }}/.yarn/cache
            ${{ env.THEME_DIR }}/.yarn/unplugged
          key: yarn-berry-${{ runner.os }}-${{ hashFiles(format('{0}/yarn.lock', env.THEME_DIR)) }}
          restore-keys: |
            yarn-berry-${{ runner.os }}-

      - name: Cache pnpm store
        if: ${{ hashFiles(format('{0}/pnpm-lock.yaml', env.THEME_DIR)) != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', env.THEME_DIR)) }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      # 7) Cache Bud/webpack cache (helps rebuilds a lot)
      - name: Cache Bud/webpack cache
        uses: actions/cache@v4
        with:
          path: ${{ env.THEME_DIR }}/node_modules/.cache
          key: budcache-${{ runner.os }}-${{ hashFiles(format('{0}/package.json', env.THEME_DIR)) }}-${{ hashFiles(format('{0}/yarn.lock', env.THEME_DIR)) }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', env.THEME_DIR)) }}-${{ hashFiles(format('{0}/package-lock.json', env.THEME_DIR)) }}
          restore-keys: |
            budcache-${{ runner.os }}-

      # 8) Install & build (auto-detect PM via lockfile)
      - name: Install & build theme (Bud)
        shell: bash
        working-directory: ${{ env.THEME_DIR }}
        run: |
          set -euxo pipefail

          if [ -f yarn.lock ]; then
            corepack enable
            corepack prepare yarn@stable --activate
            yarn --version
            (yarn install --immutable --immutable-cache) || yarn install --frozen-lockfile
            yarn build

          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            corepack prepare pnpm@latest --activate
            pnpm --version
            pnpm install --frozen-lockfile
            pnpm run build

          elif [ -f package-lock.json ]; then
            npm ci
            npm run build

          else
            echo "No lockfile found — using npm (non-deterministic)."
            npm install --no-audit --no-fund
            npm run build
          fi

          echo "== List public =="
          ls -la public || true
          echo "== Show entrypoints =="
          test -f public/entrypoints.json && head -n 50 public/entrypoints.json || true

          # HARD REQUIREMENTS
          test -f public/entrypoints.json || (echo "ERROR: missing public/entrypoints.json" && exit 1)
          css_count=$(ls public/*.css 2>/dev/null | wc -l || true)
          js_count=$(ls public/*.js  2>/dev/null | wc -l || true)
          if [ "$css_count" -eq 0 ] || [ "$js_count" -eq 0 ]; then
            echo "ERROR: missing compiled CSS/JS in public/"
            exit 1
          fi

      - name: Upload theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: theme-build
          path: ${{ env.THEME_DIR }}
          retention-days: 3

  plugins_build:
    name: Assemble Plugins (GitHub sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prep plugins dir
        run: |
          mkdir -p "${{ env.PLUGINS_DIR }}"
          echo "${{ env.BUILD_PLUGINS }}" > plugins.txt

      - name: Fetch plugins
        run: |
          set -euo pipefail
          while read -r url; do
            [ -z "$url" ] && continue
            repo=$(basename "$url")
            dir="${repo%.*}"
            git clone --depth=1 "$url" "${{ env.PLUGINS_DIR }}/${dir}"
            rm -rf "${{ env.PLUGINS_DIR }}/${dir}/.git"
          done < plugins.txt

      - name: Upload plugins artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: ${{ env.PLUGINS_DIR }}
          retention-days: 3

  package_release:
    name: Package Release
    runs-on: ubuntu-latest
    needs: [bedrock_build, theme_build, plugins_build]
    outputs:
      release_tarball: ${{ steps.bundle.outputs.release_tarball }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./_artifacts

      - name: Unpack vendor
        run: |
          tar -xzf ./_artifacts/vendor/vendor.tar.gz

      - name: Inject built theme + plugins (if present)
        run: |
          set -euo pipefail
          if [ -d ./_artifacts/theme-build ]; then
            mkdir -p web/app/themes/sage
            rsync -a ./_artifacts/theme-build/ web/app/themes/sage/
          else
            echo "No theme-build artifact; skipping theme injection."
          fi
          if [ -d ./_artifacts/plugins ]; then
            rsync -a ./_artifacts/plugins/ web/app/plugins/
          else
            echo "No plugins artifact; skipping plugin injection."
          fi

      - name: Prune dev files
        run: |
          find . -name ".git" -type d -prune -exec rm -rf {} +
          rm -rf node_modules */node_modules **/node_modules || true

      - name: Release meta
        id: meta
        run: |
          TS=$(date -u +"%Y%m%d-%H%M%S")
          echo "release_name=bedrock-${TS}" >> "$GITHUB_OUTPUT"

      - name: Setup Composer / PHP
        uses: ./.github/actions/setup-composer
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Composer install (no dev) in packaging workspace
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev

      - name: Ensure WordPress core exists in web/wp (WP-CLI fallback)
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -f web/wp/wp-settings.php ]; then
            echo "web/wp missing; fetching WordPress core via WP-CLI fallback..."
            curl -fsSL -o wp.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
            php wp.phar core download --path=web/wp --version=6.8.3 --skip-content
          fi
          test -f web/wp/wp-settings.php

      - name: Verify release contents
        run: |
          set -e
          [ -f web/wp/wp-settings.php ] || { echo "ERROR: web/wp missing from release"; exit 1; }

      - name: Bundle release tarball
        id: bundle
        run: |
          set -euxo pipefail
          name="${{ steps.meta.outputs.release_name }}"
          STAGE="$(mktemp -d)"
          rsync -a --delete \
            --exclude '_artifacts' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '*.tar.gz' \
            ./ "$STAGE/"
          tar -C "$STAGE" -czf "/tmp/${name}.tar.gz" .
          mv "/tmp/${name}.tar.gz" .
          echo "release_tarball=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload release tarball (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: ${{ steps.bundle.outputs.release_tarball }}
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_name }}
          name: ${{ steps.meta.outputs.release_name }}
          generate_release_notes: true
          files: ${{ steps.bundle.outputs.release_tarball }}

  deploy:
    name: Deploy to GCE VM
    runs-on: ubuntu-latest
    needs: [package_release]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-tarball
          path: .

      - name: Deploy via SSH/Rsync (atomic releases)
        uses: ./.github/actions/deploy-vm
        with:
          host: ${{ secrets.GCE_HOST }}
          user: ${{ secrets.GCE_USER }}
          ssh-private-key: ${{ secrets.GCE_SSH_KEY }}
          deploy-path: ${{ secrets.GCE_DEPLOY_PATH }}
          tarball: ${{ needs.package_release.outputs.release_tarball }}

      # This is idempotent
      - name: One-time WP core install (idempotent)
        uses: ./.github/actions/wp-core-install
        with:
          host: ${{ secrets.GCE_HOST }}
          user: ${{ secrets.GCE_USER }}
          ssh-private-key: ${{ secrets.GCE_SSH_KEY }}
          deploy-path: ${{ secrets.GCE_DEPLOY_PATH }}
          admin-user: ${{ secrets.WP_ADMIN_USER }}
          admin-pass: ${{ secrets.WP_ADMIN_PASS }}
          admin-email: ${{ secrets.WP_ADMIN_EMAIL }}

      - name: Activate Sage theme + flush rewrites
        shell: bash
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.GCE_USER }}@${{ secrets.GCE_HOST }} bash -se << 'EOS'
          set -euo pipefail
          cd "${{ secrets.GCE_DEPLOY_PATH }}/current"
          if [ -d "web/app/themes/sage" ]; then
            wp --path=web/wp theme activate sage || true
            wp --path=web/wp option update permalink_structure '/%postname%/' || true
            wp --path=web/wp rewrite flush --hard || true
          fi
          EOS


  health_check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - uses: actions/checkout@v4
      - name: Wait and curl site
        uses: ./.github/actions/health-check
        with:
          url: ${{ secrets.HEALTHCHECK_URL }}
          retries: "15"
          delay-seconds: "15"

  rollback_on_failure:
    name: Rollback if failed
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    needs: [deploy, health_check]
    steps:
      - uses: actions/checkout@v4
      - name: Rollback to previous release
        uses: ./.github/actions/rollback-vm
        with:
          host: ${{ secrets.GCE_HOST }}
          user: ${{ secrets.GCE_USER }}
          ssh-private-key: ${{ secrets.GCE_SSH_KEY }}
          deploy-path: ${{ secrets.GCE_DEPLOY_PATH }}
