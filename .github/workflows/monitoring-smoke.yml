name: Monitoring Smoke Test

on:
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: "Send a synthetic alert?"
        type: boolean
        default: true
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/monitoring-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.GCE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.GCE_HOST }}" >> ~/.ssh/known_hosts

      - name: Port-forward + probe Prometheus & Grafana
        run: |
          ssh -fN -L 9090:127.0.0.1:9090 -L 9093:127.0.0.1:9093 -L 3000:127.0.0.1:3000 \
            -i ~/.ssh/id_rsa ${{ secrets.GCE_USER }}@${{ secrets.GCE_HOST }}
          # give tunnel a moment
          sleep 2
          curl -fsSL http://127.0.0.1:9090/-/ready
          curl -fsSL http://127.0.0.1:9090/api/v1/status/config
          curl -fsSL http://127.0.0.1:3000/login | head -n1
          curl -fsSL http://127.0.0.1:9093/#/status | head -n1

      - name: (Optional) Send synthetic alert to Alertmanager
        if: ${{ inputs.send_test_alert }}
        run: |
          ssh -i ~/.ssh/id_rsa "${{ secrets.GCE_USER }}@${{ secrets.GCE_HOST }}" 'bash -se' <<'EOS'
          set -euo pipefail
          now=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          end=$(date -u -d "+5 minutes" +"%Y-%m-%dT%H:%M:%SZ")
          cat >/tmp/smoke.json <<JSON
          [
            {
              "labels": { "alertname":"SlackIntegrationTest", "severity":"info", "env":"${{ secrets.ALERT_ENV }}" },
              "annotations": { "summary":"Synthetic Slack test", "description":"GH workflow smoke" },
              "startsAt":"'"$now"'", "endsAt":"'"$end"'", "generatorURL":"github/smoke"
            }
          ]
          JSON
          curl -sS -X POST -H 'Content-Type: application/json' --data @/tmp/smoke.json http://127.0.0.1:9093/api/v2/alerts
          EOS
