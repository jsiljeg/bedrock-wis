global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 6h

receivers:
  - name: default
    slack_configs:
      - api_url: __SLACK_WEBHOOK__
        channel: __SLACK_CHANNEL__
        send_resolved: true
        title: "[__ALERT_ENV__] {{ .CommonLabels.alertname }}"
        text: |
          *Status:* {{ .Status }}
          *Severity:* {{ .CommonLabels.severity }}
          *Instance:* {{ .CommonLabels.instance }}
          *Summary:* {{ (index .Alerts 0).Annotations.summary }}
          *Description:* {{ (index .Alerts 0).Annotations.description }}
