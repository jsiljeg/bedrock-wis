groups:
  - name: probe-alerts
    rules:
      - alert: BedrockHttpDown
        expr: probe_success{job="blackbox_http"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "HTTP probe failed for {{ $labels.instance }}"
          description: "Blackbox probe to {{ $labels.instance }} is failing."

  - name: node-health
    rules:
      - alert: HighNodeMemoryUsage
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Available memory < 15% for 5m."
